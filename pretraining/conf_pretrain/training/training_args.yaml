gradient_accumulation_steps: 1
per_device_train_batch_size: 4
gradient_checkpointing: True
gradient_checkpointing_kwargs:
  use_reentrant: False
seed: 42
eval_strategy: "no"
save_total_limit: null
eval_steps: 0
logging_steps: 10
save_strategy: steps
