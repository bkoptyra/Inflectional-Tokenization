do_eval: False
do_train: True
bf16: True
output_dir: output_dir 
overwrite_output_dir: True
optim: adamw_torch 
learning_rate: 3e-4 
lr_scheduler_kwargs:
  min_lr_rate: 0.1 
weight_decay: 0.1
max_grad_norm: 1.0
adam_beta1: 0.9
adam_beta2: 0.95
num_train_epochs: 1.0
max_steps: -1
lr_scheduler_type: cosine_with_min_lr
warmup_ratio: 0.01 
